approval_system:
  schema_version: 3
  lifecycle:
    - proposed
    - approved_to_prepare
    - preparing
    - run_approval_required
    - approved_to_run
    - running
    - review_required
    - rejected_or_approved_for_shadow_or_invalid
  invalid_terminal: true
  evidence_source: github_issue_comment
  comment_formats:
    prepare: "APPROVED_TO_PREPARE <proposal_scope_digest>"
    run: "APPROVED_TO_RUN <run_scope_digest>"
    shadow: "APPROVED_FOR_SHADOW <review_digest>"
  target:
    repository: kazuponbaseball-cell/keiba_ai_project
    base_branch: main
    pinned_as_implementation_constants: true
    proposal_pins_base_commit: true
  remote_trust:
    provider: github_read_only_api
    current_main_ref: refs/heads/main
    compare_direction: proposal_base_commit_to_current_main_sha
    allowed_compare_status:
      - ahead
      - identical
    merge_base_must_equal_proposal_base_commit: true
    local_origin_main_trusted: false
    local_git_show_trusted: false
  allowlist:
    tracked_path: research/APPROVERS.json
    trust_source: github_proposal_base_commit_contents
    github_blob_sha_required: true
    content_sha256_required: true
    experiment_branch_copy_trusted: false
    local_worktree_copy_trusted: false
  caller_actor_is_identity_proof: false
  human_approved_flag_supported: false
  denied_approver_actor_types:
    - Bot
    - App
  denied_approver_login_classes:
    - codex
    - bot
    - automation
    - github_actions
  github_base_verification_evidence_fields:
    - repository_full_name
    - base_branch
    - verified_current_main_sha
    - verified_base_commit
    - compare_url
    - compare_status
    - merge_base_sha
    - approvers_blob_sha
    - approvers_content_sha256
    - verification_time
  comment_evidence_fields:
    - approval_type
    - approval_digest
    - repository
    - issue_number
    - comment_id
    - url
    - author
    - author_type
    - body
    - body_sha256
    - created_at
    - updated_at
  event_evidence_fields:
    new_grant: approval_evidence
    prior_reverification: revalidated_approval_evidence
    github_trust: github_trust_evidence
  grant_comment_ids:
    scope: registry_wide
    prepare_run_shadow_distinct: true
    revalidation_is_not_a_new_grant: true
  transition_reverification:
    preparing:
      - prepare
    approved_to_run:
      - prepare
    running:
      - prepare
      - run
    approved_for_shadow:
      - prepare
      - run
  immutable_comment_fields:
    - comment_id
    - issue_number
    - url
    - author
    - author_type
    - body
    - approval_type
    - approval_digest
    - body_sha256
    - created_at
    - updated_at
  fail_close_on:
    - github_unavailable
    - repository_base_branch_or_base_commit_mismatch
    - base_commit_not_current_main_ancestor
    - compare_status_or_merge_base_mismatch
    - github_approvers_missing_or_invalid
    - approval_comment_missing_edited_or_deleted
    - approval_comment_id_reused
  ci_external_network: false

scope_digest_contract:
  canonical_source: json
  markdown_authoritative: false
  serialization:
    encoding: utf_8
    object_keys: sorted
    separators: compact
    unicode: preserved
    non_finite_numbers: forbidden
    set_like_proposal_lists: sorted_unique
    order_sensitive_lists: preserved
  proposal_scope_path: research/scopes/<experiment_id>.proposal.json
  run_scope_path: research/scopes/<experiment_id>.run.json
  digest: sha256
  proposal_scope_freezes:
    - base_commit
  queue_records_proposal_digest: true
  experiment_markdown_records_proposal_digest: true
  registry_records_proposal_and_run_digest: true
  run_scope_freezes:
    - proposal_scope_and_digest
    - exact_execution_commit_sha
    - config_hashes
    - data_input_manifest_hashes
    - fold_manifest_hash
    - runner_universe_manifest_hash
    - dependency_environment_manifest
    - seed
    - exact_execution_commands
    - safety_flags
    - no_uncommitted_code_outside_hash_bound_artifacts
  post_run_results_separate_from_run_scope: true

