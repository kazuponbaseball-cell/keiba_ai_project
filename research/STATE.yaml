evidence_classes:
  A_HEAD:
    definition: audited base commitに含まれるtracked code、config、docs
    promotion_eligible: true
  B_LOCAL_HASHED:
    definition: local-onlyまたはignored artifactで、pathまたはhashを監査した暫定証拠
    promotion_eligible: false
  C_WORKTREE:
    definition: pre-existing dirty worktreeまたはlocal operational snapshot
    promotion_eligible: false
  D_DOC_CLAIM:
    definition: tracked documentにあるhistorical claimで、今回再計算していないもの
    promotion_eligible: false

baseline:
  baseline_id: BASE-20260730
  evidence: A_HEAD
  status: DOCUMENTED_NOT_REPRODUCIBLE_FROM_CLEAN_CLONE
  active_config: config/baseline_features.json
  pipeline_config: config/data_pipeline.json
  configured_model_artifact: models/baseline/baseline_ranker.pkl
  model_class:
    name: SimpleRaceRanker
    implementation: src/train/simple_ranker.py
    estimator: ridge_linear_ranker
  targets:
    implementation: src/features/baseline.py
    names:
      - target_score
      - target_win
      - target_top3
  standard_split:
    type: single_recent_temporal_holdout
    test_fraction: 0.20
    chronological: true
    nested_outer_oos_enforced: false
  production_ticket_builder:
    path: scripts/build_current_strongest_tickets.py
    market_aware: true
    research_odds_free_candidate_source: false
    notes:
      - audited HEAD joins live odds and calculates market overlays and expected ROI
      - audited HEAD can emit runtime_action BUY
      - Research OS must not import this path for candidate generation
  reproducibility:
    clean_clone_runnable: false
    tracked_tests_present_at_base: false
    tracked_ci_present_at_base: false
    dependency_lock_present_at_base: false
    tracked_model_and_output_artifacts: false
    blockers:
      - .gitignoreのdata/規則がsrc/data/loaders.pyも除外する
      - HEADの48 Python filesがuntracked src.data.loadersをimportする
      - data、models、outputsはignoredでimmutable manifestがない

