name: Research experiment
description: Research OS v1の仮説を採点し、人間承認へ送る
title: "[EXP] "
labels:
  - research
body:
  - type: markdown
    attributes:
      value: |
        75点未満は自動実行できません。75点以上でもAPPROVED_TO_RUNの人間承認が必要です。本番反映、merge、正式BUY再開はこのIssueの承認範囲外です。
  - type: input
    id: experiment_id
    attributes:
      label: Experiment ID
      placeholder: EXP-YYYYMMDD-NNN
    validations:
      required: true
  - type: textarea
    id: hypothesis
    attributes:
      label: 仮説と競馬上の作用機序
      description: null仮説、対象条件、既存特徴との差を含める
    validations:
      required: true
  - type: textarea
    id: failure_evidence
    attributes:
      label: outer OOS失敗分析
      description: 対象fold、segment、baseline artifact、再現手順を記す
    validations:
      required: true
  - type: input
    id: score_independent
    attributes:
      label: 独立情報 score / 25
      placeholder: "0"
    validations:
      required: true
  - type: input
    id: score_mechanism
    attributes:
      label: 作用機序 score / 20
      placeholder: "0"
    validations:
      required: true
  - type: input
    id: score_failure
    attributes:
      label: outer OOS根拠 score / 20
      placeholder: "0"
    validations:
      required: true
  - type: input
    id: score_leakage
    attributes:
      label: リーク安全性 score / 15
      placeholder: "0"
    validations:
      required: true
  - type: input
    id: score_falsifiability
    attributes:
      label: 最小反証可能性 score / 10
      placeholder: "0"
    validations:
      required: true
  - type: input
    id: score_cost
    attributes:
      label: 取得・実装コスト score / 10
      placeholder: "0"
    validations:
      required: true
  - type: input
    id: score_total
    attributes:
      label: 合計 score / 100
      description: 75未満はBLOCKED_SCORE
      placeholder: "0"
    validations:
      required: true
  - type: textarea
    id: minimum_experiment
    attributes:
      label: 最小実験と反証条件
      description: 変更を1つに限定し、primary metric、停止条件、compute budgetを固定する
    validations:
      required: true
  - type: textarea
    id: data_contract
    attributes:
      label: Data、as-of、outer OOS契約
      description: train/validation/calibration/test期間、purge、lineage、禁止列を書く
    validations:
      required: true
  - type: checkboxes
    id: absolute_contracts
    attributes:
      label: 絶対契約
      options:
        - label: 取消後の全C(n,3) Top3集合softmax、Top3 mass=1、derived wide mass=3を維持する
          required: true
        - label: 候補選択にodds、人気、market、払戻、ROIを使用しない
          required: true
        - label: chronological outer OOSを使い、未来・事後・リーク情報を禁止する
          required: true
        - label: formal_buy=false、send_order=false、stake=0を維持する
          required: true
        - label: mainへ直接commitせず、本番反映とmergeに人間承認を要求する
          required: true
  - type: checkboxes
    id: approval
    attributes:
      label: Human approval
      description: repository ownerまたは指定approverだけが確認する
      options:
        - label: scoreとscopeを確認し、この実験をAPPROVED_TO_RUNとする
          required: false
